  - name: Amedeo Zampieri
    affiliation: University of Verona
    # orcid:
  - name: Michele Pasqua
    affiliation: University of Verona
    orcid: 0000-0002-9475-4836
  - name: Mariano Ceccato
    affiliation: University of Verona
    orcid: 0000-0001-7325-0316
